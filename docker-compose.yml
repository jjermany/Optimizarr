services:
  optimizarr:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: optimizarr
    ports:
      - "8080:8080"
    volumes:
      - ./media:/media
      - ./config:/config
      - ./cache:/cache
    devices:
      - /dev/dri:/dev/dri
    environment:
      - LIBVA_DRIVER_NAME=iHD
      - QSV_DEVICE=/dev/dri/renderD128
    restart: unless-stopped
