services:
  optimizarr:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: optimizarr
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
      - ./config:/config
      - ./cache:/cache
    devices:
      - /dev/dri:/dev/dri
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cap_add:
      - PERFMON
    environment:
      - LIBVA_DRIVER_NAME=iHD
      - QSV_DEVICE=/dev/dri/renderD128
      - MEDIA_ROOT=/data
      - OPTIMIZARR_QMMD_METRICS_URL=http://host.docker.internal:9000/metrics
    restart: unless-stopped
