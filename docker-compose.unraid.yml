services:
  plex-optimizer:
    image: plex-optimizer:latest
    container_name: plex-optimizer
    ports:
      - "8080:8080"
    volumes:
      - /mnt/user/data/media:/media
      - /mnt/cache/appdata/plex-optimizer:/config
      - /mnt/cache/plex-optimizer-cache:/cache
    devices:
      - /dev/dri:/dev/dri
    restart: unless-stopped
