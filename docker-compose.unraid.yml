services:
  api:
    image: ghcr.io/jjermany/optimizarr:latest
    container_name: optimizarr-api
    volumes:
      - /mnt/user/data/media:/media
      - /mnt/cache/appdata/optimizarr:/config
      - /mnt/cache/appdata/optimizarr/tmp:/cache
    devices:
      - /dev/dri:/dev/dri
    restart: unless-stopped

  frontend:
    image: optimizarr-frontend:latest
    container_name: optimizarr-frontend
    depends_on:
      - api
    ports:
      - "8085:80"
    restart: unless-stopped
