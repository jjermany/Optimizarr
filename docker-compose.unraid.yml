services:
  optimizarr:
    image: ghcr.io/jjermany/optimizarr:latest
    container_name: optimizarr
    ports:
      - "8080:8080"
    volumes:
      - /mnt/user/data:/data
      - /mnt/cache/appdata/optimizarr:/config
      - /mnt/cache/appdata/optimizarr/tmp:/cache
    devices:
      - /dev/dri:/dev/dri
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cap_add:
      - PERFMON
    environment:
      - LIBVA_DRIVER_NAME=iHD
      - QSV_DEVICE=/dev/dri/renderD128
      - MEDIA_ROOT=/data
      - OPTIMIZARR_QMMD_METRICS_URL=http://host.docker.internal:9000/metrics
    restart: unless-stopped
